services:
  # --- ENTORNO STAGING ---
  db:
    image: postgis/postgis:16-3.4
    container_name: dasha-db-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_dasha
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dasha_dev}
      POSTGRES_DB: dasha_staging
    volumes:
      - dasha_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: dasha-backend-staging
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      PORT: 3000
      CORS_ORIGIN: https://staging.dashamx.me
      DATABASE_URL: postgresql://admin_dasha:${DB_PASSWORD:-dasha_dev}@db:5432/dasha_staging?schema=public
      JWT_SECRET: ${JWT_SECRET:-dasha_super_secret_key_2026_fepro}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: staging
      FRONTEND_URL: https://staging.dashamx.me
      BACKEND_URL: https://api.staging.dashamx.me
    depends_on:
      - db

  # --- ENTORNO PRODUCCIÓN ---
  db-prod:
    image: postgis/postgis:16-3.4
    container_name: dasha-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_dasha
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dasha_dev}
      POSTGRES_DB: dasha_prod
    volumes:
      - dasha_prod_data:/var/lib/postgresql/data

  # --- RESPALDOS AUTOMÁTICOS (PRODUCCIÓN) ---
  db-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: dasha-db-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db-prod
      POSTGRES_DB: dasha_prod
      POSTGRES_USER: admin_dasha
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dasha_dev}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
    volumes:
      - dasha_prod_backups:/backups
    depends_on:
      - db-prod

  backend-prod:
    build: ./backend
    container_name: dasha-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: https://dashamx.me,https://www.dashamx.me,https://app.dashamx.me
      DATABASE_URL: postgresql://admin_dasha:${DB_PASSWORD:-dasha_dev}@db-prod:5432/dasha_prod?schema=public
      JWT_SECRET: ${JWT_SECRET:-dasha_super_secret_key_2026_fepro}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: production
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      FRONTEND_URL: https://dashamx.me
      BACKEND_URL: https://api.dashamx.me
    depends_on:
      - db-prod

  # --- RUTEO GLOBAL ---
  caddy:
    image: caddy:2-alpine
    container_name: dasha-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - /root/dasha-app/web:/usr/share/caddy
      - caddy_config:/config
    depends_on:
      - backend
      - backend-prod

volumes:
  dasha_db_data:
  dasha_prod_data:
  dasha_prod_backups:
  caddy_data:
  caddy_config:
